<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — BotterShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/js/jquery.min.js"></script>
    <script src="/js/md5.min.js"></script>
    <script src="/js/common.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2e3347;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-glow: rgba(99,102,241,0.25);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px;
        }
        /* Glow orbs */
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; pointer-events: none;
            filter: blur(80px); opacity: .35;
        }
        body::before {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #6366f1, transparent);
            top: -100px; left: -100px;
        }
        body::after {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #a78bfa, transparent);
            bottom: -80px; right: -80px;
        }

        .brand {
            font-size: 1.5rem; font-weight: 700; margin-bottom: 36px;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px 36px;
            width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
            position: relative; z-index: 1;
        }
        .card h2 {
            font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;
        }
        .card .subtitle {
            font-size: .875rem; color: var(--text-muted); margin-bottom: 28px;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block; font-size: .8rem; font-weight: 500;
            color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em;
        }
        input[type="text"], input[type="password"] {
            width: 100%; background: #0f1117;
            border: 1px solid var(--border); border-radius: 10px;
            padding: 13px 16px; color: var(--text); font-size: .95rem;
            outline: none; transition: border-color .2s, box-shadow .2s;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        input::placeholder { color: var(--text-muted); }

        .btn-login {
            width: 100%; margin-top: 8px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            border: none; border-radius: 10px;
            padding: 14px; color: #fff; font-size: 1rem; font-weight: 600;
            cursor: pointer; letter-spacing: .02em;
            transition: opacity .2s, transform .15s, box-shadow .2s;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-login:hover { opacity: .9; transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }

        .notice {
            margin-top: 16px; text-align: center;
            font-size: .8rem; color: var(--text-muted);
            background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.2);
            border-radius: 8px; padding: 10px 14px;
        }
        .skip-link {
            display: block; text-align: center; margin-top: 20px;
            font-size: .875rem; color: var(--accent-hover); text-decoration: none;
        }
        .skip-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="brand">⚡ BotterShop</div>
    <div class="card">
        <h2>欢迎回来</h2>
        <p class="subtitle">登录以获取个性化体验</p>

        <div class="form-group">
            <label>手机号码</label>
            <input id="mobile" type="text" placeholder="请输入手机号" maxlength="11">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input id="password" type="password" placeholder="请输入密码（6-16位）" minlength="6" maxlength="16"
                   onkeydown="if(event.key==='Enter')login()">
        </div>

        <button class="btn-login" id="loginBtn" onclick="login()">立即登录</button>

        <div class="notice">
            🚧 登录功能开发中，点击下方按钮直接体验商品搜索
        </div>
        <a class="skip-link" href="/search_goods.html">→ 跳过登录，直接搜索商品</a>
    </div>

    <script>
        function login() {
            var mobile = $('#mobile').val().trim();
            var pwd = $('#password').val();
            // 后端登录接口尚未完成，暂时直接跳转
            window.location.href = '/search_goods.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — BotterShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/js/jquery.min.js"></script>
    <script src="/js/md5.min.js"></script>
    <script src="/js/common.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2e3347;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-glow: rgba(99,102,241,0.25);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px;
        }
        /* Glow orbs */
        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; pointer-events: none;
            filter: blur(80px); opacity: .35;
        }
        body::before {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #6366f1, transparent);
            top: -100px; left: -100px;
        }
        body::after {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #a78bfa, transparent);
            bottom: -80px; right: -80px;
        }

        .brand {
            font-size: 1.5rem; font-weight: 700; margin-bottom: 36px;
            background: linear-gradient(135deg, #6366f1, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px 36px;
            width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
            position: relative; z-index: 1;
        }
        .card h2 {
            font-size: 1.4rem; font-weight: 700; margin-bottom: 6px;
        }
        .card .subtitle {
            font-size: .875rem; color: var(--text-muted); margin-bottom: 28px;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block; font-size: .8rem; font-weight: 500;
            color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em;
        }
        input[type="text"], input[type="password"] {
            width: 100%; background: #0f1117;
            border: 1px solid var(--border); border-radius: 10px;
            padding: 13px 16px; color: var(--text); font-size: .95rem;
            outline: none; transition: border-color .2s, box-shadow .2s;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        input::placeholder { color: var(--text-muted); }

        .btn-login {
            width: 100%; margin-top: 8px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            border: none; border-radius: 10px;
            padding: 14px; color: #fff; font-size: 1rem; font-weight: 600;
            cursor: pointer; letter-spacing: .02em;
            transition: opacity .2s, transform .15s, box-shadow .2s;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-login:hover { opacity: .9; transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }

        .notice {
            margin-top: 16px; text-align: center;
            font-size: .8rem; color: var(--text-muted);
            background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.2);
            border-radius: 8px; padding: 10px 14px;
        }
        .skip-link {
            display: block; text-align: center; margin-top: 20px;
            font-size: .875rem; color: var(--accent-hover); text-decoration: none;
        }
        .skip-link:hover { text-decoration: underline; }
        .toggle-link {
            display: block; text-align: center; margin-top: 16px;
            font-size: .875rem; color: var(--accent-hover); text-decoration: none; cursor: pointer;
        }
        .toggle-link:hover { text-decoration: underline; }
        .msg {
            display: none; margin-top: 14px;
            font-size: .85rem; padding: 10px 14px; border-radius: 8px;
        }
        .msg.err { display: block; color: #fca5a5; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); }
        .msg.ok  { display: block; color: #86efac; background: rgba(34,197,94,.1);  border: 1px solid rgba(34,197,94,.25); }
    </style>
</head>
<body>
    <div class="brand">⚡ BotterShop</div>
    <div class="card">
        <!-- ========== 登录表单 ========== -->
        <div id="loginPanel">
            <h2>欢迎回来</h2>
            <p class="subtitle">登录以获取个性化体验</p>

            <div class="form-group">
                <label>手机号码</label>
                <input id="mobile" type="text" placeholder="请输入手机号" maxlength="11">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input id="password" type="password" placeholder="请输入密码（6-16位）" minlength="6" maxlength="16"
                       onkeydown="if(event.key==='Enter')login()">
            </div>

            <button class="btn-login" id="loginBtn" onclick="login()">立即登录</button>
            <div class="msg" id="loginMsg"></div>
            <a class="toggle-link" onclick="togglePanel('register')">没有账号？立即注册</a>
        </div>

        <!-- ========== 注册表单 ========== -->
        <div id="registerPanel" style="display:none;">
            <h2>创建账号</h2>
            <p class="subtitle">注册一个属于你的 BotterShop 账号</p>

            <div class="form-group">
                <label>手机号码</label>
                <input id="regMobile" type="text" placeholder="请输入手机号" maxlength="11">
            </div>
            <div class="form-group">
                <label>昵称（可选）</label>
                <input id="regNickname" type="text" placeholder="请输入昵称" maxlength="20">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input id="regPassword" type="password" placeholder="请输入密码（6-16位）" minlength="6" maxlength="16"
                       onkeydown="if(event.key==='Enter')register()">
            </div>

            <button class="btn-login" id="registerBtn" onclick="register()">立即注册</button>
            <div class="msg" id="registerMsg"></div>
            <a class="toggle-link" onclick="togglePanel('login')">已有账号？返回登录</a>
        </div>

        <div class="notice">
            🚧 登录功能开发中，点击下方按钮直接体验商品搜索
        </div>
        <a class="skip-link" href="/search_goods.html">→ 跳过登录，直接搜索商品</a>
    </div>

    <script>
        // 网关地址：路由 Path=/user/** 且 StripPrefix=1，网关会剥掉第一段 /user 再转发
        // 动态取当前页面 host，避免跨站导致 cookie 无法保存
        var baseUrl = g_gatewayBase() + '/user';

        // 与后端 MD5Util.inputPassToFormPass 使用同一个固定盐、同一套加盐规则
        function formPass(inputPass) {
            var salt = g_passsword_salt; // common.js 中定义的 1a2b3c4d
            return md5(salt.charAt(0) + salt.charAt(2) + inputPass + salt.charAt(5) + salt.charAt(4));
        }

        function showMsg(id, text, ok) {
            var el = document.getElementById(id);
            el.textContent = text;
            el.className = 'msg ' + (ok ? 'ok' : 'err');
        }

        function validMobile(mobile) {
            return /^1\d{10}$/.test(mobile);
        }

        function togglePanel(panel) {
            document.getElementById('loginPanel').style.display = panel === 'login' ? '' : 'none';
            document.getElementById('registerPanel').style.display = panel === 'register' ? '' : 'none';
        }

        function login() {
            var mobile = $('#mobile').val().trim();
            var pwd = $('#password').val();
            if (!validMobile(mobile)) {
                showMsg('loginMsg', '请输入正确的 11 位手机号', false);
                return;
            }
            if (pwd.length < 6) {
                showMsg('loginMsg', '密码长度至少 6 位', false);
                return;
            }
            $.ajax({
                url: baseUrl + '/login/dologin',
                type: 'POST',
                xhrFields: { withCredentials: true },
                crossDomain: true,
                data: {
                    mobile: mobile,
                    // 前端做一次 md5 + 固定盐，传输密文而非明文
                    password: formPass(pwd)
                },
                success: function (data) {
                    if (data.code === 200) {
                        localStorage.setItem('token', data.data);
                        g_setTokenCookie(data.data);
                        showMsg('loginMsg', '登录成功，正在跳转...', true);
                        setTimeout(function () {
                            window.location.href = '/search_goods.html';
                        }, 600);
                    } else {
                        showMsg('loginMsg', data.msg || '登录失败', false);
                    }
                },
                error: function () {
                    showMsg('loginMsg', '网络异常，请稍后重试', false);
                }
            });
        }

        function register() {
            var mobile = $('#regMobile').val().trim();
            var nickname = $('#regNickname').val().trim();
            var pwd = $('#regPassword').val();
            if (!validMobile(mobile)) {
                showMsg('registerMsg', '请输入正确的 11 位手机号', false);
                return;
            }
            if (pwd.length < 6) {
                showMsg('registerMsg', '密码长度至少 6 位', false);
                return;
            }
            $.ajax({
                url: baseUrl + '/register/register',
                type: 'POST',
                xhrFields: { withCredentials: true },
                crossDomain: true,
                data: {
                    mobile: mobile,
                    nickname: nickname,
                    // 注册与登录使用同一套加密规则：md5 + 固定盐
                    password: formPass(pwd)
                },
                success: function (data) {
                    if (data.code === 200) {
                        showMsg('registerMsg', '注册成功，请登录', true);
                        setTimeout(function () {
                            $('#mobile').val(mobile);
                            togglePanel('login');
                        }, 600);
                    } else {
                        showMsg('registerMsg', data.msg || '注册失败', false);
                    }
                },
                error: function () {
                    showMsg('registerMsg', '网络异常，请稍后重试', false);
                }
            });
        }
    </script>
</body>
</html>

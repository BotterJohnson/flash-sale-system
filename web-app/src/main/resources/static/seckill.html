<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>限时秒杀 - BotterShop</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-2: #ec4899;
            --primary-soft: rgba(124, 58, 237, .12);
            --primary-glow: rgba(124, 58, 237, .28);
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --text: #1f2937;
            --text-soft: #6b7280;
            --text-muted: #9ca3af;
            --surface: #fff;
            --surface-2: #f5f6fa;
            --border: #e8e9f0;
            --border-strong: #d5d7e0;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(16, 24, 40, .06);
            --shadow-lg: 0 12px 32px rgba(16, 24, 40, .1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #fbfaff 0%, #f4f5fb 240px, #f7f8fc 100%);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= Navbar ================= */
        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255, 255, 255, .88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }
        .navbar-inner {
            max-width: 1200px; margin: 0 auto;
            padding: 12px 24px;
            display: flex; align-items: center; gap: 20px;
        }
        .navbar-brand {
            font-size: 1.15rem; font-weight: 800; letter-spacing: -.02em;
            color: var(--text); text-decoration: none; white-space: nowrap;
        }
        .navbar-brand .bolt {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-right: 2px;
        }
        .navbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
        .nav-link {
            color: var(--text-soft); text-decoration: none;
            font-size: .85rem; font-weight: 500;
            padding: 7px 12px; border-radius: var(--radius-sm);
            transition: background .15s, color .15s;
        }
        .nav-link:hover { background: var(--surface-2); color: var(--primary); }
        .nav-link.active { color: var(--primary); background: var(--primary-soft); }
        .badge {
            display: inline-block; min-width: 18px;
            background: var(--primary); color: #fff;
            font-size: .68rem; font-weight: 700;
            padding: 1px 6px; border-radius: 999px; margin-left: 4px; text-align: center;
        }

        /* ================= Page ================= */
        .page { max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px; }

        .page-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .page-title h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
        .page-title .count { font-size: .85rem; color: var(--text-muted); }
        .page-subtitle { font-size: .88rem; color: var(--text-soft); margin-top: 6px; }
        .page-subtitle .fire {
            background: linear-gradient(135deg, #f97316, var(--danger));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }

        /* ================= Publish panel ================= */
        .publish-card {
            margin: 22px 0 26px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .publish-card summary {
            cursor: pointer; list-style: none;
            padding: 13px 18px;
            font-size: .85rem; font-weight: 600; color: var(--text-soft);
            display: flex; align-items: center; gap: 8px;
            user-select: none;
        }
        .publish-card summary::-webkit-details-marker { display: none; }
        .publish-card summary:hover { background: var(--surface-2); }
        .publish-card summary .arrow { transition: transform .2s; color: var(--primary); }
        .publish-card[open] summary .arrow { transform: rotate(90deg); }
        .publish-body {
            padding: 4px 18px 18px;
            border-top: 1px solid var(--border);
            display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
        }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: .74rem; color: var(--text-muted); font-weight: 600; }
        .field input {
            width: 138px; border: 1px solid var(--border); background: var(--surface);
            border-radius: var(--radius-sm); padding: 8px 11px;
            font-size: .85rem; color: var(--text); outline: none; font-family: inherit;
            transition: border-color .15s, box-shadow .15s;
        }
        .field input:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft);
        }
        .field .hint { font-size: .7rem; color: var(--text-muted); }
        .btn-primary-sm {
            border: none; cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: #fff; font-weight: 600; font-size: .82rem;
            padding: 9px 20px; border-radius: var(--radius-sm);
            box-shadow: 0 4px 12px var(--primary-glow);
            transition: transform .15s, filter .15s;
        }
        .btn-primary-sm:hover { transform: translateY(-1px); filter: brightness(1.05); }

        /* ================= Seckill cards ================= */
        .seckill-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }
        .s-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex; flex-direction: column;
            transition: transform .22s cubic-bezier(.2, .8, .2, 1), box-shadow .22s, border-color .22s;
            animation: cardIn .32s ease both;
        }
        .s-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(124, 58, 237, .35);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .s-img {
            position: relative; aspect-ratio: 4/3;
            background: linear-gradient(135deg, #fafbff, #f1f2f8);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .s-img img { width: 100%; height: 100%; object-fit: cover; }
        .s-img-ph { font-size: 3.2rem; opacity: .28; }
        .s-status-tag {
            position: absolute; top: 10px; left: 10px;
            font-size: .68rem; font-weight: 700;
            padding: 4px 9px; border-radius: 6px;
            backdrop-filter: blur(8px);
        }
        .tag-running { background: rgba(239, 68, 68, .9); color: #fff; }
        .tag-wait    { background: rgba(245, 158, 11, .92); color: #fff; }
        .tag-end     { background: rgba(107, 114, 128, .9); color: #fff; }
        .s-countdown {
            position: absolute; top: 10px; right: 10px;
            background: rgba(17, 24, 39, .78); color: #fff;
            font-size: .7rem; font-weight: 600; font-variant-numeric: tabular-nums;
            padding: 4px 9px; border-radius: 6px;
            backdrop-filter: blur(8px);
        }

        .s-body { padding: 14px 15px 15px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .s-name {
            font-size: .95rem; font-weight: 600; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            min-height: 2.6em;
        }
        .s-price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .s-price .now { display: flex; align-items: baseline; }
        .s-price .cur { font-size: .78rem; font-weight: 700; color: var(--danger); }
        .s-price .val { font-size: 1.4rem; font-weight: 800; color: var(--danger); letter-spacing: -.02em; }
        .s-price .old { font-size: .78rem; color: var(--text-muted); text-decoration: line-through; }

        .s-progress-wrap { display: flex; flex-direction: column; gap: 5px; }
        .s-progress {
            height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden;
        }
        .s-progress-bar {
            height: 100%; border-radius: 999px;
            background: linear-gradient(90deg, var(--primary), var(--primary-2));
            transition: width .4s ease;
        }
        .s-progress-bar.full { background: linear-gradient(90deg, #9ca3af, #6b7280); }
        .s-stock-text { font-size: .74rem; color: var(--text-muted); display: flex; justify-content: space-between; }

        .s-btn {
            margin-top: auto; border: none; cursor: pointer;
            width: 100%; padding: 11px;
            border-radius: var(--radius-sm);
            font-size: .88rem; font-weight: 700; color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 4px 14px var(--primary-glow);
            transition: transform .15s, filter .15s, box-shadow .15s;
        }
        .s-btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); }
        .s-btn:active:not(:disabled) { transform: translateY(0); }
        .s-btn:disabled {
            cursor: not-allowed; color: #fff;
            background: var(--border-strong); box-shadow: none;
        }
        .s-btn.done { background: linear-gradient(135deg, var(--success), #34d399); box-shadow: 0 4px 14px rgba(16, 185, 129, .28); }
        .s-btn.wait { background: linear-gradient(135deg, var(--warning), #fbbf24); box-shadow: 0 4px 14px rgba(245, 158, 11, .28); }

        /* ================= Empty ================= */
        .empty {
            grid-column: 1/-1; text-align: center;
            padding: 64px 20px 72px; color: var(--text-muted);
        }
        .empty .icon { font-size: 3.6rem; opacity: .35; margin-bottom: 14px; }
        .empty p { font-size: .92rem; margin-bottom: 6px; }
        .empty .sub { font-size: .8rem; opacity: .8; }

        /* ================= Toast ================= */
        #toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(40px);
            background: rgba(31, 41, 55, .95); color: #fff;
            padding: 11px 22px; border-radius: 999px;
            font-size: .85rem; font-weight: 500;
            box-shadow: var(--shadow-lg);
            opacity: 0; pointer-events: none;
            transition: all .3s cubic-bezier(.2, .8, .2, 1);
            z-index: 999; backdrop-filter: blur(8px);
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* ================= Result modal ================= */
        .mask {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(17, 24, 39, .45);
            backdrop-filter: blur(3px);
            display: none; align-items: center; justify-content: center;
        }
        .mask.show { display: flex; animation: fadeIn .2s ease both; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            width: min(400px, 90vw);
            background: var(--surface); border-radius: var(--radius-lg);
            padding: 32px 28px 24px; text-align: center;
            box-shadow: 0 24px 60px rgba(16, 24, 40, .22);
            animation: popIn .26s cubic-bezier(.2, .8, .2, 1) both;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(.92) translateY(12px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal .emoji { font-size: 3rem; margin-bottom: 10px; }
        .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .modal .desc { font-size: .84rem; color: var(--text-soft); margin-bottom: 16px; }
        .modal .order-id {
            background: var(--surface-2); border: 1px dashed var(--border-strong);
            border-radius: var(--radius-sm); padding: 11px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: .95rem; font-weight: 700; letter-spacing: .06em; color: var(--primary);
            margin-bottom: 20px; word-break: break-all;
        }
        .modal .ok-btn {
            width: 100%; border: none; cursor: pointer; padding: 11px;
            border-radius: var(--radius-sm); color: #fff; font-weight: 700; font-size: .88rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        /* ================= Responsive ================= */
        @media (max-width: 640px) {
            .navbar-inner { padding: 12px 16px; gap: 10px; }
            .page { padding: 20px 16px 60px; }
            .seckill-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .field input { width: 100%; }
            .field { flex: 1 1 140px; }
        }
        /* ================= 次要按钮 / 提示 ================= */
        .btn-ghost-sm {
            border: 1px solid var(--border); cursor: pointer;
            background: var(--surface); color: var(--text-muted);
            font-weight: 500; font-size: .82rem;
            padding: 7px 14px; border-radius: var(--radius-sm);
            transition: all .15s;
        }
        .btn-ghost-sm:hover { border-color: var(--primary); color: var(--primary); }
        .hint { font-size: .74rem; color: var(--text-muted); align-self: center; }

        /* ================= 我的战绩 ================= */
        .mine-list {
            padding: 12px 18px 16px;
            border-top: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 8px;
        }
        .mine-item {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 10px 14px;
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            font-size: .84rem;
        }
        .mine-item .name { font-weight: 600; color: var(--text); }
        .mine-item .no {
            font-size: .74rem; color: var(--text-muted);
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }
        .mine-item .price { color: var(--primary); font-weight: 700; white-space: nowrap; }
        .mine-empty { font-size: .84rem; color: var(--text-muted); padding: 4px 2px; }
    </style>
</head>
<body>

<!-- ============== Navbar ============== -->
<nav class="navbar">
    <div class="navbar-inner">
        <a class="navbar-brand" href="/search_goods.html"><span class="bolt">⚡</span>BotterShop</a>
        <div class="navbar-right">
            <a class="nav-link active" href="/seckill.html">秒杀</a>
            <a class="nav-link" href="/order_list.html">订单</a>
            <a class="nav-link" href="/cart_list.html">购物车<span class="badge" id="cartBadge">0</span></a>
            <span id="userNav" style="display: flex; align-items: center; gap: 6px;">
                <a class="nav-link" href="/login.html">登录</a>
            </span>
        </div>
    </div>
</nav>

<!-- ============== Page ============== -->
<main class="page">
    <div class="page-title">
        <h1>⚡ 限时秒杀</h1>
        <span class="count" id="listCount">加载中…</span>
    </div>
    <p class="page-subtitle">库存有限，每人限购一件，先到先得 <span class="fire">🔥</span></p>

    <!-- 发布活动（管理用，默认收起） -->
    <details class="publish-card">
        <summary><span class="arrow">›</span> 发布 / 重置秒杀活动</summary>
        <div class="publish-body">
            <div class="field">
                <label>商品 ID</label>
                <input id="pGoodsId" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="如 1432247758961553400">
            </div>
            <div class="field">
                <label>秒杀价（元）</label>
                <input id="pPrice" type="number" placeholder="如 9.9" min="0" step="0.01">
            </div>
            <div class="field">
                <label>库存件数</label>
                <input id="pStock" type="number" placeholder="如 50" min="1">
            </div>
            <div class="field">
                <label>延迟开始（分钟）</label>
                <input id="pDelay" type="number" placeholder="默认 0" min="0" value="0">
            </div>
            <div class="field">
                <label>持续时长（分钟）</label>
                <input id="pDuration" type="number" placeholder="默认 30" min="1" value="30">
            </div>
            <button class="btn-primary-sm" onclick="publish()">发布活动</button>
            <button class="btn-ghost-sm" onclick="resetActivity()">重置活动</button>
            <div class="field">
                <span class="hint">提示：商品 ID 可打开商品详情页从地址栏 goodsId 查看；重置会把库存刷回初始值</span>
            </div>
        </div>
    </details>

    <!-- 秒杀商品列表 -->
    <section class="seckill-grid" id="seckillGrid"></section>

    <!-- 我的秒杀战绩 -->
    <details class="publish-card" id="mineCard">
        <summary><span class="arrow">›</span> 我的秒杀战绩</summary>
        <div class="mine-list" id="mineList">
            <div class="mine-empty">加载中…</div>
        </div>
    </details>
</main>

<!-- ============== Toast ============== -->
<div id="toast"></div>

<!-- ============== Result modal ============== -->
<div class="mask" id="resultMask">
    <div class="modal">
        <div class="emoji">🎉</div>
        <h3>恭喜，抢购成功！</h3>
        <p class="desc">请尽快完成支付，超时订单将被取消</p>
        <div class="order-id" id="resultOrderId"></div>
        <button class="ok-btn" onclick="closeResult()">知道啦</button>
    </div>
</div>

<script src="/js/jquery.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/seckill.js"></script>
</body>
</html>

server:
  port: 8081

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: localhost
      port: 6379
      password: Zheng#123
      database: 7 # 必须与 user-service 一致，否则网关读不到登录会话
  cloud:
    gateway:
      server:
        webflux:
          # Spring Cloud Gateway 4.x 新键：spring.cloud.gateway.server.webflux.routes
          routes:
            - id: botter-shop-goods-route
              uri: http://localhost:18001
              predicates:
                - Path=/goods/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5

            - id: botter-shop-user-route
              uri: http://localhost:18006
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1

            - id: botter-shop-order-route
              uri: http://localhost:18002
              predicates:
                - Path=/order/**
              filters:
                - StripPrefix=1

          # Spring Cloud Gateway 4.x 新键：spring.cloud.gateway.server.webflux.globalcors
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:18004"
                  - "http://127.0.0.1:18004"
                allowed-headers:
                  - "*"
                allow-credentials: true
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志 
  is-log: true




eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka

# 日志：自定义 RequestLogFilter 打印请求转发与耗时；RoutePredicateHandlerMapping 打印路由匹配详情
logging:
  level:
    com.botter.shop.gateway: info
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: debug
      
feign:
  hystrix:
    enabled: true
